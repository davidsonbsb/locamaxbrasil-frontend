<c-card>
  <c-card-body>
    <mat-form-field appearance="outline" class="dense-1 field-100">
      <mat-label>Filtro</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Filtro" #input>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table" matSort (matSortChange)="announceSortChange($event)">
        @for (column of columns; track column) {
          <ng-container [matColumnDef]="column.columnDef">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #DDD;">
              {{column.header}}
            </th>
            <td mat-cell *matCellDef="let row">
              {{column.cell(row)}}
            </td>
          </ng-container>
        }
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </c-card-body>
  <c-card-footer>
    <mat-paginator
    [pageSizeOptions]="[10, 25, 100]"
    aria-label="Selecione a pagina"
  ></mat-paginator>
  </c-card-footer>
</c-card>
