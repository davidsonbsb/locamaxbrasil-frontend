<c-card>
  <c-card-body>
      <div class="row">
          <div class="col-6 menu-item">
          <mat-form-field appearance="outline" class="dense-1 field-100">
              <mat-label>Filtro</mat-label>
              <input matInput (keyup)="applyFilter($event)" placeholder="Filtro" #input>
          </mat-form-field>
          </div>
      </div>

<div class="table-responsive shadow">
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table" matSort (matSortChange)="announceSortChange($event)">
  @for (column of columns; track column) {
    <ng-container [matColumnDef]="column.columnDef">
      <th mat-header-cell *matHeaderCellDef mat-sort-header style="background-color: #DDD;">
        {{column.header}}
      </th>
      <td mat-cell *matCellDef="let row" (click)="openFormDialog(row.id)" [ngClass]="{'bg-danger fw-bold': checkVencimentoApp(row.id) == 'expirado', 'bg-warning fw-bold': checkVencimentoApp(row.id) == 'expirando'}">
          @if (column.header == 'Servidor' ) {
              <img [src]="getServidorLogo((column.cell(row)))" class="icon-server ms-3">
          }

          @else {
              {{column.cell(row)}}
          }

      </td>
    </ng-container>
  }
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
</div>

</c-card-body>
<c-card-footer>
  <mat-paginator
  [pageSizeOptions]="[10, 25, 100]"
  aria-label="Selecione a pagina"
></mat-paginator>
</c-card-footer>
</c-card>
