<div class="p-2 mt-2">

    <c-card [cBorder]="{top: {color: 'dark' , width: 3}}" class="shadow" >
      <c-card-body>
        <div class="row mt-3">
            <div class="d-flex col-6">
                <mat-icon class="me-2">paid</mat-icon>
                <p class="fs-5">Dados Pagamento</p>
            </div>
            <div class="col-6 text-end">
                <p><span class="fw-bold fs-5 me-3" [ngClass]="{'pago': financeiro.status, 'npago' : !financeiro.status}">{{ vencimento }}</span></p>
            </div>
      </div>
      <div>
          <hr>
      </div>
      <div class="row my-4 mx-3">

        <div class="col-md-6 mt-3">
            <p> Cliente: <span class="fw-light">{{ cliente.nome }}</span></p>
            <p> Servidor: <span class="fw-light">{{ cliente.servidor_id }}</span></p>
            <p> Valor: <span class="fw-light">R$ {{ financeiro.valor | decimal }}</span></p>
        </div>

        <div class="col-md-6">
            <c-card [color]="'light'">
                <c-card-body class="bg-gradient">
                  <p> Tipo: <span class="fw-light">{{ financeiro.tipo }}</span></p>
                  <p> Banco: <span class="fw-light">{{ banco.nome }}</span></p>
                  <p> Status: <span class="fw-bold" [ngClass]="{'pago': financeiro.status, 'npago' : !financeiro.status}">{{ financeiro.status ? 'Pago' : 'Não Pago'}}</span></p>
                </c-card-body>
            </c-card>
        </div>
    </div>
      </c-card-body>
      <c-card-footer>
        <button
        class="btn btn-sm btn-danger mx-3 my-3"
        routerLink="/clientes"
      >Voltar
      </button>
      </c-card-footer>
  </c-card>
</div>
